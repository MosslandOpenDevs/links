version: 1
# Invariant register for links.moss.land (Mossland Verified Links).
# Draft — INTENDED classifications and critical invariants are pending the human
# intent review (PROFILE.md section 4.3). Status reflects current evidence, not
# accepted intent. Critical invariants are not "VERIFIED" just because code exists.
invariants:
  - id: INV-PHISH-001
    title: Every listed non-third-party entry is a Mossland-controlled presence
    statement: >-
      A link rendered on the page without the 제3자 (third-party) chip is a
      Mossland-controlled presence (owner "mossland") — either a verified Mossland
      domain (a *.moss.land site) or an official Mossland-controlled channel/account
      on a third-party platform (Medium, X, GitHub). Only entries with owner
      "third-party" or tier "third_party" are non-Mossland, and those always render
      the 제3자 chip.
    severity: critical
    intent:
      classification: INTENDED
      authority: null  # pending human intent review (PROFILE.md 4.3)
    scope: The rendered directory (index.html, embed.html) generated from ecosystem-registry.json.
    assumptions:
      - Each service's owner/tier fields in ecosystem-registry.json are set correctly by human curation.
      - The registry commit history is trustworthy (no unreviewed edit introduced a false entry).
    limitations:
      - There is no cryptographic or automated proof that a listed entry is Mossland-controlled; correctness rests on human curation (see DEF-PHISH-001, RES-VERIFY-001).
      - "Mossland-controlled for off-domain channels (Medium, X, GitHub) means an official account under Mossland's control, not infrastructure Mossland operates. The on-page copy phrases this as 'operated by Mossland' (see the limitation on CLAIM-PHISH-001)."
    enforcement:
      - "build/generate.mjs chipFor() lines 45-53: the 제3자 chip is emitted iff owner === 'third-party' || tier === 'third_party'; every other entry (including owner 'mossland' channel/developer entries) renders as a verified Mossland chip."
      - "ecosystem-registry.json owner field: all non-market entries declare owner 'mossland'."
    verification:
      - Manual curation review on each registry pull request (README.md 'Adding or changing a service').
      - "Live-domain verification recorded via the footer '최종 확인' date (build/generate.mjs line 180, 260); last verified 2026-07-06 (ecosystem-registry.json generatedAt)."
    evidence:
      - "build/generate.mjs:45-53 (chip derivation; owner 'mossland' channel/developer entries fall through to the verified-Mossland chip)"
      - "README.md chips table (the 공식 chip means 'Verified Mossland domain or official channel')"
      - "build/generate.mjs:191-194 (VERIFY copy: 'every link here is operated by Mossland')"
    defeaters:
      - DEF-PHISH-001
    residuals:
      - RES-VERIFY-001
    status: INFERRED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)

  - id: INV-REG-001
    title: The rendered pages are a pure projection of the registry
    statement: >-
      index.html, embed.html, llms.txt, and sitemap.xml contain no link that is not
      present in ecosystem-registry.json; the registry is the single source of truth
      and the generated files are a deterministic projection of it.
    severity: critical
    intent:
      classification: INTENDED
      authority: null
    scope: All generated artifacts produced by build/generate.mjs.
    assumptions:
      - The committed generated files were produced by running build/generate.mjs against the committed registry.
    limitations:
      - Projection purity is verified at the current revision only; nothing in CI enforces it on every future commit, so a later hand edit or stale commit could diverge (see DEF-REG-001, RES-CI-VALIDATION-001).
    enforcement:
      - "build/generate.mjs renders exclusively from reg.services (lines 10, 76-97, 121-134, 181-184); README.md states the outputs must not be hand-edited."
    verification:
      - "Idempotent regeneration bound to a revision: at b53be92, `node build/generate.mjs` then `git diff --quiet` exits 0 (committed output byte-identical to the generator's output). See assurance/evidence/EVIDENCE.md EV-PROJECTION-b53be92."
    evidence:
      - "assurance/evidence/EVIDENCE.md EV-PROJECTION-b53be92 (regenerate-and-diff, clean at b53be92, captured 2026-07-18)"
      - "build/generate.mjs:76-97 (renderSections reads reg.services)"
      - "README.md:23-32 ('generated from the registry ... Do not edit them by hand')"
    defeaters:
      - DEF-REG-001
    residuals:
      - RES-CI-VALIDATION-001
    status: VERIFIED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)

  - id: INV-PASSPORT-001
    title: Third-party and off-domain channel entries are never Passport-eligible
    statement: >-
      No service with tier "third_party" or tier "channel" has passportEligible true;
      third-party market links and off-domain channels can never back a Passport
      ecosystem stamp.
    severity: high
    intent:
      classification: INTENDED
      authority: null
    scope: ecosystem-registry.json passportEligible / stampType / stampClass fields.
    assumptions:
      - Consumers (Passport, City, WA) trust passportEligible as the gate for issuing a stamp.
    limitations:
      - "The schema encodes only this negative direction (third_party/channel ⇒ not eligible). The broader property that every Passport-eligible entry is Mossland-controlled holds in the current registry by curation (all 11 eligible entries have owner 'mossland'), not by schema: an entry of another tier on a non-Mossland domain marked passportEligible true would still validate. Binding passportEligible:true to owner 'mossland' in the schema would close this. See CLAIM-PASSPORT-002, DEF-PASSPORT-001, RES-CI-VALIDATION-001."
      - The schema constraint is not run in CI, so a violating edit would not be automatically rejected (see DEF-PASSPORT-001).
    enforcement:
      - "ecosystem-registry.schema.json allOf lines 102-111: if tier is third_party then passportEligible const false; if tier is channel then passportEligible const false."
      - "Registry data: every third_party (markets) and channel (Medium, X) entry has passportEligible false."
    verification:
      - "JSON Schema (draft 2020-12) validation of ecosystem-registry.json against ecosystem-registry.schema.json — reproducible by any consumer; not yet wired into CI."
    evidence:
      - "ecosystem-registry.schema.json:102-111 (allOf if/then constraints for third_party and channel)"
      - "ecosystem-registry.json (all owner 'third-party' and channel entries: passportEligible false)"
    defeaters:
      - DEF-PASSPORT-001
    residuals:
      - RES-CI-VALIDATION-001
    status: VERIFIED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)

  - id: INV-RENDER-001
    title: Registry values are HTML-escaped into the generated markup
    statement: >-
      Registry-derived strings rendered through card(), domLine(), and the section
      markup are HTML-escaped, so registry content cannot inject markup or script into
      the page body.
    severity: high
    intent:
      classification: INTENDED
      authority: null
    scope: HTML body interpolation in build/generate.mjs (card, domLine, section headers).
    assumptions:
      - ecosystem-registry.json is trusted, Mossland-curated input, not attacker-controlled.
    limitations:
      - "One registry-derived value is rendered without esc(): the generatedAt-derived last-verified date, interpolated into the footer (build/generate.mjs:260) and sitemap.xml (:340-341). Risk is nil because generatedAt is schema-constrained to format date-time (ecosystem-registry.schema.json:12) and is trusted input."
      - "The JSON-LD blocks are serialized with JSON.stringify and are not </script>-escaped (see DEF-RENDER-001, RES-RENDER-JSONLD-001); mitigated by trusted input and CSP script-src 'self'."
    enforcement:
      - "build/generate.mjs esc() lines 12-13, applied to every card()/domLine()/section-title interpolation (card() 62-73, domLine() 55-60, section titles 85-94)."
      - "customHttp.yml Content-Security-Policy line 5: script-src 'self' (no unsafe-inline for scripts) blocks injected inline/external script as defense in depth."
    verification:
      - Code inspection of build/generate.mjs interpolation sites (card/domLine/section headers all pass through esc()).
    evidence:
      - "build/generate.mjs:12-13 (esc definition), :62-73 (card uses esc on name/role/domain/url)"
      - "customHttp.yml:5 (script-src 'self')"
    defeaters:
      - DEF-RENDER-001
    residuals:
      - RES-RENDER-JSONLD-001
    status: VERIFIED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)

  - id: INV-CORS-001
    title: Only the public read-only registry is exposed cross-origin
    statement: >-
      The only responses served with Access-Control-Allow-Origin "*" are the public,
      read-only ecosystem-registry.json and ecosystem-registry.schema.json; the site
      exposes no credentialed, mutating, or private cross-origin surface.
    severity: high
    intent:
      classification: INTENDED
      authority: null
    scope: HTTP response headers served by AWS Amplify per customHttp.yml.
    assumptions:
      - The site is a static deployment with no backend, cookies, or authenticated endpoints.
    limitations:
      - Verified by a one-time manual capture of the live responses (2026-07-18), not by an automated/continuous check; a later platform or config change could drop the scoping (see DEF-HTTP-001, RES-HEADERS-001).
    enforcement:
      - "customHttp.yml lines 35-50: ACAO '*' and Cross-Origin-Resource-Policy 'cross-origin' are scoped to /ecosystem-registry.json and /ecosystem-registry.schema.json only; the global default-src 'self' / connect-src 'self' CSP (line 5) governs everything else."
    verification:
      - "Live response headers captured 2026-07-18 (assurance/evidence/EVIDENCE.md EV-HEADERS-2026-07-18): /ecosystem-registry.json returns ACAO '*'; a normal page carries connect-src 'self' and form-action 'none'."
    evidence:
      - "assurance/evidence/EVIDENCE.md EV-HEADERS-2026-07-18 (served-response capture)"
      - "customHttp.yml:31-50 (registry CORS block, scoped by path pattern)"
      - "customHttp.yml:5 (connect-src 'self', form-action 'none')"
    defeaters:
      - DEF-HTTP-001
    residuals:
      - RES-HEADERS-001
    status: VERIFIED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)

  - id: INV-FRAME-001
    title: The page may be framed only by Mossland origins
    statement: >-
      The page may be embedded only by links.moss.land itself and Mossland's
      Mossverse origins (wa.moss.land and its subdomains), preventing clickjacking or
      framing by an impersonator while still allowing the intended embed.html kiosk.
    severity: medium
    intent:
      classification: INTENDED
      authority: null
    scope: CSP frame-ancestors directive on all responses.
    assumptions:
      - AWS Amplify applies customHttp.yml as written.
    limitations:
      - Verified by a one-time manual capture (2026-07-18), not by an automated/continuous check (see RES-HEADERS-001).
    enforcement:
      - "customHttp.yml:5 CSP frame-ancestors 'self' https://wa.moss.land https://*.wa.moss.land."
    verification:
      - "Live response header captured 2026-07-18 (assurance/evidence/EVIDENCE.md EV-HEADERS-2026-07-18): GET / returns the frame-ancestors allow-list exactly as declared."
    evidence:
      - "assurance/evidence/EVIDENCE.md EV-HEADERS-2026-07-18 (served-response capture)"
      - "customHttp.yml:5 (frame-ancestors)"
      - "build/generate.mjs:271-302 (embed.html kiosk view intended for framing inside play.wa / Mossverse)"
    defeaters:
      - DEF-HTTP-001
    residuals:
      - RES-HEADERS-001
    status: VERIFIED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)

  - id: INV-MARKET-001
    title: Third-party market links are marked and disclaimed
    statement: >-
      Every third-party market or exchange link renders the 제3자 chip, sits in the
      시세·거래소 (Markets) section, and is accompanied by a notice stating the links
      are reference only and not a trading recommendation.
    severity: medium
    intent:
      classification: INTENDED
      authority: null
    scope: The markets section of the rendered page and the llms.txt / JSON output.
    assumptions:
      - Market entries keep owner "third-party" / tier "third_party" and section "markets".
    limitations:
      - The disclaimer is presentational; it does not prevent a user from acting on a price link.
    enforcement:
      - "build/generate.mjs:31 markets section note ('Third-party market links are provided for reference only and are not trading recommendations')."
      - "build/generate.mjs:191-194 VERIFY copy scopes the Mossland-operated guarantee to exclude third-party market links."
      - "build/generate.mjs:48 chipFor(): owner 'third-party' / tier 'third_party' renders the 제3자 chip."
    verification:
      - Rendered-output inspection of the markets section and legend.
    evidence:
      - "build/generate.mjs:26-32 (markets note), :330-331 (llms.txt notes)"
      - "ecosystem-registry.json (coinmarketcap, coingecko, upbit, bithumb, coinone, gopax: tier third_party, section markets, passportEligible false)"
    defeaters: []
    residuals:
      - RES-STATUS-DRIFT-001
    status: VERIFIED
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
