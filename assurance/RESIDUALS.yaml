# Residual register for links.moss.land — known limitations and remaining doubt
# (PROFILE.md sections 2 and 12).
#
# Residual review completed 2026-07-18 by the human owner (MosslandOpenDevs
# maintainers). Dispositions at that review (7 entries then registered): 2 RESOLVED
# by remediation, 4 ACCEPTED with recorded rationale, 1 (RES-CURATION-002) left OPEN
# for remediation. This header is a point-in-time record of that review; the current
# per-residual status is the `status:` field on each entry below. An agent prepared
# this review but did not accept anything on the owner's behalf (PROFILE.md section 15).
residuals:
  - id: RES-VERIFY-001
    summary: >-
      Domain authenticity and service statuses are established by periodic manual
      verification, not continuous monitoring. Between verifications the directory can
      be stale — a domain's control or a service's status could change without the
      page reflecting it.
    private_detail_location: null
    affected_claims:
      - CLAIM-PHISH-001
    affected_invariants:
      - INV-PHISH-001
    impact: medium
    uncertainty: medium
    mitigation:
      - "The footer shows the last-verified date ('최종 확인', build/generate.mjs:180,260)."
      - Registry edits go through pull-request review grounded in the live site (README.md 'Always ground descriptions in the live site').
    status: ACCEPTED
    acceptance_rationale: >-
      Inherent to the design and accepted as proportionate. A static registry cannot
      cryptographically prove domain ownership; eliminating this residual would require
      continuous monitoring infrastructure disproportionate to the project. The public
      claim (CLAIM-PHISH-001) is already scoped to OPERATOR_ATTESTED and states the
      periodic-verification limitation, so the claim does not exceed its evidence.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: MosslandOpenDevs maintainers (Mossland)
    accepted_at: 2026-07-18
    review_after: 2026-10-18

  - id: RES-CI-VALIDATION-001
    summary: >-
      No continuous validation ran on change. Neither JSON Schema validation of
      ecosystem-registry.json against its schema, nor a check that the committed
      generated files match a fresh `node build/generate.mjs` run, was wired into CI.
      Registry, projection, and Passport-eligibility invariants therefore relied on
      author discipline.
    private_detail_location: null
    affected_claims:
      - CLAIM-REG-001
      - CLAIM-PASSPORT-001
      - CLAIM-PASSPORT-002
    affected_invariants:
      - INV-REG-001
      - INV-PASSPORT-001
    impact: medium
    uncertainty: low
    mitigation:
      - The generator is pure and idempotent, so a local regenerate-and-diff catches projection drift.
      - Pull-request review.
    status: RESOLVED
    resolution_note: >-
      Remediated 2026-07-18 by .github/workflows/registry.yml, which runs on every push
      and pull request: (a) .github/scripts/validate-registry.py validates the registry
      against ecosystem-registry.schema.json (draft 2020-12), which is what enforces
      INV-PASSPORT-001, and additionally asserts that every passportEligible entry has
      owner 'mossland' (CLAIM-PASSPORT-002) and that service ids are unique; (b) a
      regenerate-and-diff step fails the build if the committed pages are not
      byte-identical to a fresh generator run (INV-REG-001). Verified by a negative
      test before merge: marking a third_party entry passportEligible produced two
      errors and exit 1; the unmodified registry exits 0.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: null
    accepted_at: null
    review_after: 2026-10-18

  - id: RES-HEADERS-001
    summary: >-
      The deployed security headers were confirmed by a manual capture
      (2026-07-18, EV-HEADERS-001) but are not verified by an automated,
      continuous check; their ongoing presence depends on AWS Amplify honouring
      customHttp.yml, and a later platform/config change could drop them undetected.
    private_detail_location: null
    affected_claims: []
    affected_invariants:
      - INV-CORS-001
      - INV-FRAME-001
    impact: low
    uncertainty: low
    mitigation:
      - Headers are declared centrally in customHttp.yml and reviewed on change.
      - "Confirmed live (assurance/evidence/EVIDENCE.md EV-HEADERS-001)."
    status: ACCEPTED
    acceptance_rationale: >-
      Accepted as low impact. The headers are declared in a single reviewed file and
      were confirmed to match the served responses exactly. A continuous check would
      have to call the live site from CI, making the build network-dependent and prone
      to false failures; a scheduled post-deploy assertion is the better shape and is
      recorded as a future improvement rather than a blocker.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: MosslandOpenDevs maintainers (Mossland)
    accepted_at: 2026-07-18
    review_after: 2026-10-18

  - id: RES-RENDER-JSONLD-001
    summary: >-
      The JSON-LD structured-data blocks were not escaped against early termination of
      the script element. The risk was bounded by trusted curated input and CSP
      script-src 'self', but the defence-in-depth escape was not applied.
    private_detail_location: null
    affected_claims: []
    affected_invariants:
      - INV-RENDER-001
    impact: low
    uncertainty: low
    mitigation:
      - "CSP script-src 'self' blocks injected inline/external scripts (customHttp.yml:5)."
      - Registry input is trusted, Mossland-curated data.
    status: RESOLVED
    resolution_note: >-
      Remediated 2026-07-18 in build/generate.mjs jsonLd(): the serialized JSON-LD now
      escapes "<" as its < escape sequence, so no registry value can terminate the
      script element early. JSON.parse restores "<", so consumers see identical data.
      Verified: all three ld+json blocks in the regenerated index.html parse correctly.
      The change produced no diff in the generated output, because no current registry
      value contains "<" — the fix is preventive and there was no live exposure.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: null
    accepted_at: null
    review_after: 2026-10-18

  - id: RES-STATUS-DRIFT-001
    summary: >-
      The registry records point-in-time operational facts for ecosystem services in
      `status` and `note`. These states drift, so both can lag the live services. This
      is not hypothetical: the 2026-07-06 values for alpha ('paused') and ao ('degraded')
      were still in the registry on 2026-08-23, 48 days later, and both were wrong by
      then — see review_note.
    private_detail_location: null
    affected_claims: []
    affected_invariants:
      - INV-MARKET-001
    impact: low
    uncertainty: high
    mitigation:
      - "The ecosystem section carries a note that '실험' services are not finished official products (build/generate.mjs:23)."
      - "Since 2026-08-23, statusVerifiedAt records per entry when its status was last checked, so the age of an observation is visible to a consumer instead of inferred from the document-level generatedAt. This makes drift detectable; it does not prevent it."
    status: ACCEPTED
    acceptance_rationale: >-
      Accepted as an inherent property of a manually curated directory and as low
      impact: a stale operational status does not weaken the anti-phishing guarantee,
      which is about which domains are genuinely Mossland's, not about uptime. The page
      is explicit that it is not a live uptime monitor (assurance/SYSTEM.md section 2).
    review_note: >-
      Re-reviewed 2026-08-23. The acceptance stands — the reasoning above is unchanged
      and the impact is still low — but one recorded mitigation did not survive contact
      with practice and has been withdrawn. It read "Statuses are re-verified against the
      live services when the registry is updated." On 2026-08-21 the registry WAS updated
      (commit 9c7b186: media retired, Mossland Signal registered) and neither alpha nor
      ao was re-verified. Both values, first recorded 2026-07-06, were still wrong 48 days
      later: alpha stood at "paused" while /api/health?strict=1 returned status ok, db ok,
      worst_status ok over 1642 indexed pages, and ao stood at "degraded" while /api/status
      returned operational with every component healthy (both captured 2026-08-23,
      EV-STATUS-001). That mitigation was author discipline described as a control, with
      nothing enforcing it; the honest position is that it was not operating, so it is
      removed rather than restated. Uncertainty is raised medium -> high accordingly: the
      registry has now demonstrated, not merely risked, carrying a wrong operational
      status across an edit. Impact stays low for the reason already recorded.
      What replaces it is weaker than a control and is described as such: statusVerifiedAt
      makes staleness visible. Anything stronger — a scheduled probe that compares the
      registry against live health endpoints — would reverse the owner-approved non-goal
      in assurance/SYSTEM.md section 2 ("not a live uptime monitor"), which is the very
      basis on which this residual was accepted. That is a separate owner decision and is
      deliberately not taken here.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: MosslandOpenDevs maintainers (Mossland)
    accepted_at: 2026-07-18
    reviewed_at: 2026-08-23
    review_after: 2026-10-18

  # --- data-curation profile (PROFILE.md 6.4) gaps, recorded on adoption 2026-07-18 ---

  - id: RES-CURATION-001
    summary: >-
      The registry does not separate externally observed facts from Mossland's own
      editorial judgement. A service object mixes observed facts (domain, url, ticker)
      with Mossland classifications (tier, chip, status, label/labelKo,
      passportEligible, stampType, stampClass) in one flat structure, with no field or
      convention marking which is which. A cross-origin consumer cannot tell an
      observed fact from a curatorial opinion. Provenance for the observed side is also
      thin: sourceOfTruth is set on only a few entries and lastDataAt is null on every
      entry.
    private_detail_location: null
    affected_claims:
      - CLAIM-REG-001
    affected_invariants: []
    impact: medium
    uncertainty: low
    mitigation:
      - "The distinction is documented narratively in assurance/SYSTEM.md section 3.1 (fact vs judgement field table) as an interim measure."
      - README.md documents what each tier and chip means, so the judgements are at least explained.
      - "Staged remediation: mark judgement fields explicitly in ecosystem-registry.schema.json (or group them under a nested object), and populate lastDataAt / sourceOfTruth for entries whose data is observed."
    status: ACCEPTED
    acceptance_rationale: >-
      Accepted for now with the narrative separation in SYSTEM.md section 3.1 as the
      interim mitigation. Closing it properly means restructuring a public schema that
      other Mossland properties already consume, so it warrants its own scoped change
      with consumer impact analysis rather than being bundled into the adoption. Impact
      is bounded: no consumer currently depends on distinguishing fact from judgement,
      and the registry's judgements are documented in README.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: MosslandOpenDevs maintainers (Mossland)
    accepted_at: 2026-07-18
    review_after: 2026-10-18

  - id: RES-CURATION-002
    summary: >-
      There was no versioned history of the classification and scoring rubric. The
      tier-to-chip derivation and the stampClass significance meanings were the
      registry's editorial rubric, but they lived only in current code
      (build/generate.mjs chipFor) and prose (README chips table). The registry's
      version field versions the document, not the rubric, so an entry carried no
      record of which rubric version classified it. If the rubric changed, the meaning
      of an unchanged entry changed silently — and stampClass is consumed by Passport
      to weight ecosystem stamps, so a silent rubric change propagated into stamp
      weighting.
    private_detail_location: null
    affected_claims:
      - CLAIM-PASSPORT-002
    affected_invariants:
      - INV-PHISH-001
    impact: medium
    uncertainty: medium
    mitigation:
      - "The rubric was at least documented and data-driven (chip derivation keys off owner/tier/chip, never a service id)."
    status: RESOLVED
    resolution_note: >-
      Remediated 2026-07-18. The rubric is now declared as data in
      ecosystem-registry.json `rubric` and versioned by `rubricVersion` (1.0.0),
      separately from `version` so a change in classification meaning is visible even
      when no entry changed. Rather than adding a third place for the rubric to live,
      build/generate.mjs was rewired to derive BOTH the chip assignment and the on-page
      legend from that object, so code cannot drift from the declared rubric; the
      refactor was verified behaviour-preserving by producing byte-identical output
      (assurance/evidence/EVIDENCE.md EV-RUBRIC-001). ecosystem-registry.schema.json
      now requires rubricVersion and rubric, and .github/scripts/validate-registry.py
      enforces rubric consistency in CI — negative-tested on three failure modes.
      assurance/RUBRIC.md carries the changelog and the version-bump rules, whose
      governing test is "would an unchanged entry now render or mean differently?".
      Numeric stamp weights are deliberately still not defined here: that is Passport's
      policy, and asserting it would claim authority over another system.
      Residual limitation: per-entry rubric provenance (which rubric version classified
      a given entry) is still not recorded — document-level versioning was judged
      proportionate for a registry that is re-verified wholesale. That thinness is
      covered by RES-CURATION-001, and the README summary table remains an unchecked
      prose copy (RES-PROVENANCE-001).
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: null
    accepted_at: null
    review_after: 2026-10-18
    # Was deliberately NOT accepted in the 2026-07-18 residual review: this was the one
    # residual whose consequence left this repository — stampClass feeds Passport's stamp
    # weighting, so a silent rubric change alters another system's behaviour. The owner
    # chose remediation over acceptance, and this entry records that remediation landing.

  # --- Recorded 2026-07-18, after the residual review, when grounding the
  # --- amplify.yml classification exposed a systemic evidence-provenance problem.

  - id: RES-PROVENANCE-001
    summary: >-
      Much of this repository's explanatory prose — code comments, README
      descriptions, registry `note` fields — was written in AI-co-authored commits.
      PROFILE.md section 7 excludes AI-generated explanation as evidence by itself,
      so any intent classification grounded in that prose is weaker than it looks:
      one agent asserts a rationale, a later agent cites the assertion as proof of
      human intent. Found while grounding the amplify.yml `|| true` classification,
      whose only evidence was a comment introduced in an AI-co-authored commit
      (d688deb); that one was re-grounded on explicit owner confirmation, but the
      same pattern applies wherever prose is the sole evidence — for example the
      README chips table cited by INV-PHISH-001.
    private_detail_location: null
    affected_claims: []
    affected_invariants:
      - INV-PHISH-001
    impact: medium
    uncertainty: medium
    mitigation:
      - "Classifications grounded in machine-checkable artifacts — schema constraints, served response headers, command output, code behaviour — are unaffected; these carry most of assurance/SYSTEM.md section 9."
      - "Where prose was the only ground, the classification was re-grounded on explicit owner confirmation and the substitution recorded (see the amplify.yml footnote in assurance/SYSTEM.md section 9)."
      - "Staged remediation: audit the remaining prose-grounded rows in section 9 and either re-ground them on a machine-checkable artifact or obtain owner confirmation per row."
    status: OPEN
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: null
    accepted_at: null
    review_after: 2026-10-18

  # --- Recorded 2026-08-23, adopting the MIP-1 lifecycle policy into the schema.

  - id: RES-LIFECYCLE-001
    summary: >-
      The MIP-1 lifecycle policy is enforceable but not yet in force. The schema, the
      rubric declaration and the CI check are in place and demonstrated (EV-LIFECYCLE-001),
      but no service carries a lifecycle value: 17 of 17 entries in MIP-1 Article 1 scope
      are unclassified, because the classification is an owner decision that this change
      deliberately did not make. Two consequences follow. First, INV-LIFECYCLE-001 and
      INV-LIFECYCLE-002 hold vacuously — they constrain a set that is currently empty.
      Second, MIP-1 Article 1 requires the state to be *displayed* on links.moss.land, and
      build/generate.mjs does not render lifecycle at all; today `status` is not rendered
      either, so no lifecycle information reaches a visitor. The display obligation is
      therefore unmet until a follow-up change both populates the values and renders them.
    private_detail_location: null
    affected_claims:
      - CLAIM-REG-001
    affected_invariants:
      - INV-LIFECYCLE-001
      - INV-LIFECYCLE-002
    impact: medium
    uncertainty: low
    mitigation:
      - "The validator reports the gap explicitly on every run rather than passing silently: it names the unclassified services and the count in MIP-1 Article 1 scope."
      - "The mapping proposed by MIP-1 Annex A is drafted and awaiting owner approval, so the remaining work is a decision, not a design."
      - "MIP-1 allows 14 days after ratification for exactly this step; the mechanism landing first is what makes that window achievable."
    status: RESOLVED
    resolution_note: >-
      Remediated 2026-08-23, by owner decision on the four open questions the residual
      recorded. (a) Values applied: all 17 services in MIP-1 Article 1 scope now carry a
      lifecycle, per Annex A — with the Annex A Core candidates published as beta under
      Annex A's own unstaffed rule (Art. 3 exception recorded in each lifecycleReason,
      maintainer MosslandOpenDevs as the accountable body until named individuals are
      designated); signal, absent from Annex A, classified lab; algora archived with
      passportEligible withdrawn (10 eligible entries remain). (b) Displayed: the
      generator now renders each in-scope service's state on the page as a marker in the
      card's domain line plus a legend section, both derived from rubric.lifecycle —
      the same single-declaration arrangement the chips use — and llms.txt carries the
      state per entry. (c) lifecycleReviewedAt is set; the initial classification act is
      the first Article 4 review. The change ships in a pull request held for merge
      until MIP-1's vote closes (2026-09-02), inside the policy's 14-day window.
      Residual limitation, recorded rather than hidden: maintainer names an accountable
      org, not yet the named individuals with deploy and recovery rights that Article 2
      intends — promotion of the five Core candidates out of the Art. 3 exception is the
      remaining human act, visible in each entry's lifecycleReason.
    disclosure: PUBLIC
    owner: MosslandOpenDevs maintainers (Mossland)
    accepted_by: null
    accepted_at: null
    review_after: 2026-09-16
    # review_after retained: the first post-ratification monthly review (MIP-1 Art. 4)
    # should confirm the applied values and revisit the Core-candidate exceptions.
