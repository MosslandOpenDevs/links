version: 1
frontend:
  phases:
    build:
      commands:
        # Regenerate index.html + embed.html from ecosystem-registry.json.
        # Committed output is identical, so this is idempotent; `|| true` keeps the
        # deploy from breaking if the generator ever fails (committed files ship).
        - node build/generate.mjs || true
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - embed.html
      - favicon.svg
      - og.png
      - apple-touch-icon.png
      - robots.txt
      - sitemap.xml
      - llms.txt
      - ecosystem-registry.json
      - ecosystem-registry.schema.json
      # The health artifact (HEALTH_CONTRACT.md). Written by the generator above and
      # deliberately not committed, so unlike every other entry here it exists ONLY if
      # that command succeeded — the `|| true` means a generator failure ships the
      # committed pages with no /api/health rather than a stale one.
      - api/health
      - api/health.json
  cache:
    paths: []
