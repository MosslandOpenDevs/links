# Agentic Assurance Profile validation for adopting repositories.
# The @-ref below is pinned to the SAME full 40-character commit SHA as
# upstream.commit in .agentic-assurance/adoption.yaml, and is updated together
# with that pin (docs/ADOPTION.md §3.4 of the pinned profile).
name: assurance

on:
  push:
  pull_request:
    # 'edited' matters: the drift check reads the PR description, and the
    # default types would leave a stale verdict when the description changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  assurance:
    uses: MosslandOpenDevs/agentic-assurance-profile/.github/workflows/adopter-validate.yml@aac49ef7f0d8a8e8762113df8b7bf1784eaa2e54
