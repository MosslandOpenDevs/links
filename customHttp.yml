customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'self' https://wa.moss.land https://*.wa.moss.land; upgrade-insecure-requests"
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'
      - key: 'Permissions-Policy'
        value: 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()'
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains'
  # Force UTF-8 on plain-text files. Without this Amplify serves charset-less
  # text/plain, and the global nosniff header blocks encoding recovery, so any
  # non-ASCII (e.g. Korean) renders as mojibake.
  - pattern: '/llms.txt'
    headers:
      - key: 'Content-Type'
        value: 'text/plain; charset=utf-8'
  - pattern: '/robots.txt'
    headers:
      - key: 'Content-Type'
        value: 'text/plain; charset=utf-8'
  - pattern: '/sitemap.xml'
    headers:
      - key: 'Content-Type'
        value: 'text/xml; charset=utf-8'
  # The ecosystem registry is a public, read-only, non-credentialed source of truth
  # consumed cross-origin by other Mossland properties (moss.land, passport, city, wa).
  # `*` is the only workable ACAO value here: Amplify serves a single static header
  # value and cannot echo the request Origin, and CORS forbids a space-separated list.
  - pattern: '/ecosystem-registry.json'
    headers:
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'
      - key: 'Cache-Control'
        value: 'public, max-age=300'
  - pattern: '/ecosystem-registry.schema.json'
    headers:
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
