# OpenDevs Agentic Assurance Profile — adoption declaration for links.moss.land.
# See AGENTIC_ASSURANCE.md (repo root) and the pinned profile at the commit below.
# DRAFT: the profile selection and human_owner below are proposals pending human
# review (PROFILE.md section 4.3 / docs/REVIEW-GUIDE.md). Nothing here is accepted
# until the repository owner reviews it.
upstream:
  repository: MosslandOpenDevs/agentic-assurance-profile
  # v0.1.0-rc.1 is the latest published tag; its VERSION file reads v0.1.0-rc.1,
  # which the adopter validator requires to match this pin exactly. (HEAD of the
  # profile's default branch reads v0.1.0-dev, which is forbidden in an adopter pin.)
  version: v0.1.0-rc.1
  commit: 8377ecd0223d7c66234af5bc9ce102646881482d

project:
  name: Mossland Verified Links
  repository: MosslandOpenDevs/links
  # Governing body for this repository, confirmed by the owner (2026-07-18):
  # the MosslandOpenDevs maintainers as a body, not a single named individual.
  # The contents of ecosystem-registry.json (the authenticity source of truth)
  # are ultimately governed by Mossland DAO via Agora (agora.moss.land);
  # see assurance/SYSTEM.md section 5.
  human_owner: MosslandOpenDevs maintainers (Mossland)

profiles:
  - core            # substantially AI-agent-built repository
  - service         # deployed website + public read-only registry (AWS Amplify)
  - trust-critical  # anti-phishing / domain-authenticity is the page's core purpose
  - data-curation   # the registry is curated, classified, scored data: tier/chip/status
                    # judgments, and the stampClass significance weighting consumed by
                    # Passport. Added by owner decision 2026-07-18.
                    # Provisional upstream profile — its obligations may change in a minor
                    # release and the validator emits a non-blocking warning on selection.
                    # Known PROFILE.md 6.4 gaps are recorded as RES-CURATION-001
                    # (external fact vs editorial judgment not separated) and
                    # RES-CURATION-002 (no versioned classification/scoring rubric).

specification_workflow:
  system: existing
  # GitHub pull requests. The change workflow is documented in README.md
  # ("Source of truth" and "Adding or changing a service").
  root: README.md

paths:
  system: assurance/SYSTEM.md
  invariants: assurance/INVARIANTS.yaml
  claims: assurance/CLAIMS.yaml
  defeaters: assurance/DEFEATERS.yaml
  residuals: assurance/RESIDUALS.yaml
  threat_model: assurance/THREAT_MODEL.md
  evidence: assurance/evidence

security:
  policy: SECURITY.md
  public_assurance_root: assurance
  # Non-actionable label only. Suspected vulnerabilities go to GitHub Private
  # Vulnerability Reporting / a draft Security Advisory, never a public Issue.
  restricted_record: external_private_system

issue_integration:
  stable_id_required: true
  public_security_issues_allowed: false
  closing_requires_artifact_update: true

# PARTIAL review record. The PROFILE.md section 4.3 intent review is NOT complete;
# this records the decisions the owner has made so far. Do not read this block as
# an adoption sign-off.
human_review:
  date: 2026-07-18
  reviewer: MosslandOpenDevs maintainers (Mossland)
  record: https://github.com/MosslandOpenDevs/links/pull/6
  status: partial
  decided:
    - human_owner is the maintainers body rather than a named individual
    - "profile set: added data-curation, with its two 6.4 gaps recorded openly"
    - "public claim wording refined so it no longer over-states control of off-domain platforms"
    - "residual review of all 7 entries: 2 RESOLVED by remediation, 4 ACCEPTED with rationale, 1 (RES-CURATION-002) deliberately left OPEN"
  outstanding:
    - sign-off on purpose and non-goals, and on the behaviour classification in assurance/SYSTEM.md section 9
    - approval of the critical invariants (INV-PHISH-001, INV-REG-001) as human-approved intent — intent.authority is still null on every invariant
    - "repository settings the agent cannot change: enable GitHub Private Vulnerability Reporting, create the assurance/* and needs-human-approval issue labels"
